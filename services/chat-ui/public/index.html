<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>agent-commerce: chat</title>
  <style>
    :root { --bg: #f8fafc; --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --me: #dbeafe; --bot: #dcfce7; }
    body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
    header { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
    h1 { font-size: 18px; margin: 0; }
    select, input, button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
    button { cursor: pointer; }
    #log { flex: 1; overflow: auto; padding: 12px 0; display: flex; flex-direction: column; gap: 8px; }
    .msg { padding: 8px 12px; border-radius: 10px; max-width: 80%; white-space: pre-wrap; }
    .me { background: var(--me); align-self: flex-end; }
    .bot { background: var(--bot); align-self: flex-start; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    form { display: flex; gap: 8px; }
    form input { flex: 1; }
    #status { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Shop chat</h1>
    <label>Customer <select id="customer"></select></label>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="text" placeholder="I want 1 kg of coffee beans" autocomplete="off" required>
    <button type="submit">Send</button>
  </form>
  <div id="status">connecting…</div>
</main>
<script src="/app.js"></script>
</body>
</html>
