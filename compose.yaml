# agent-commerce: 15 containers (design §14): 7 services, 6 agents, postgres, rabbitmq.
# One Node image for all; the command differs per container.
# Host ports: chat-ui 3000, orders 3001 (board), email 3002 (inbox), catalogue-mock 3003 (manager),
# shipping-mock 3004 (courier), RabbitMQ UI 15672. Postgres 55432 and AMQP 55672 are for host runs (scripts/dev-host.sh).
# customers (3005) and payment-mock (3006) have no host port.
# Agents: ANTHROPIC_API_KEY and MODEL_NAME come from .env. AGENT_MODE=scripted runs them without a model.

x-node: &node
  build: .
  image: agent-commerce-node
  env_file:
    - path: .env
      required: false
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:18@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: ac
      POSTGRES_PASSWORD: ac
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ac"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.4-management@sha256:af6f50d38098d8bd52fef7f3fa85015dd8b2bf6def58e995bf584ae9ba0f6407
    environment:
      RABBITMQ_DEFAULT_USER: ac
      RABBITMQ_DEFAULT_PASS: ac
    ports:
      - "15672:15672"
      - "55672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------- services
  chat-ui:
    <<: *node
    command: node services/chat-ui/src/main.ts
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"

  orders:
    <<: *node
    command: node services/orders/src/main.ts
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://ac:ac@postgres:5432/orders

  email:
    <<: *node
    command: node services/email/src/main.ts
    ports:
      - "3002:3002"
    environment:
      PORT: "3002"
      DATABASE_URL: postgres://ac:ac@postgres:5432/email
      PUBLIC_BASE_URL_ORDERS: http://localhost:3001

  catalogue-mock:
    <<: *node
    command: node services/catalogue-mock/src/main.ts
    ports:
      - "3003:3003"
    environment:
      PORT: "3003"
      DATABASE_URL: postgres://ac:ac@postgres:5432/catalogue

  shipping-mock:
    <<: *node
    command: node services/shipping-mock/src/main.ts
    ports:
      - "3004:3004"
    environment:
      PORT: "3004"
      DATABASE_URL: postgres://ac:ac@postgres:5432/shipping

  customers:
    <<: *node
    command: node services/customers/src/main.ts
    environment:
      PORT: "3005"
      DATABASE_URL: postgres://ac:ac@postgres:5432/customers

  payment-mock:
    <<: *node
    command: node services/payment-mock/src/main.ts
    environment:
      PORT: "3006"
      DATABASE_URL: postgres://ac:ac@postgres:5432/payment

  # ---------------------------------------------------------------- agents
  agent-shopping:
    <<: *node
    command: node agents/shopping/main.ts
    environment:
      MCP_SERVERS: http://catalogue-mock:3003/mcp,http://orders:3001/mcp

  agent-offer:
    <<: *node
    command: node agents/offer/main.ts
    environment:
      MCP_SERVERS: http://orders:3001/mcp,http://catalogue-mock:3003/mcp

  agent-inventory:
    <<: *node
    command: node agents/inventory/main.ts
    environment:
      MCP_SERVERS: http://catalogue-mock:3003/mcp

  agent-notification:
    <<: *node
    command: node agents/notification/main.ts
    environment:
      MCP_SERVERS: http://orders:3001/mcp,http://email:3002/mcp

  agent-shipping:
    <<: *node
    command: node agents/shipping/main.ts
    environment:
      MCP_SERVERS: http://shipping-mock:3004/mcp

  agent-payment:
    <<: *node
    command: node agents/payment/main.ts
    environment:
      MCP_SERVERS: http://payment-mock:3006/mcp

volumes:
  pgdata:
