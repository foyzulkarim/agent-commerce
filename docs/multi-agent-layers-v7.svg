<text x="405" y="575" font-size="10.5" fill="#1f2937" text-anchor="start">tool calls (main server)</text>
<text x="982" y="546" font-size="10" fill="#4b5563">Plain code, in orders. Gate and Status updater write the orders DB.</text>
<text x="30" y="880" font-size="11.5" fill="#111827">Read from top to bottom: an actor uses an entry point. The entry point publishes an event. Reactors consume it, call guarded tools, and publish new events.</text>
<text x="30" y="898" font-size="11.5" fill="#111827">Nothing below band 2 starts by itself. The event names and the order of steps are in the flow view. Full tool list of each agent: agents/*/agent.json.</text>
